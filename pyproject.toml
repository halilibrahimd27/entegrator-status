[project]
name = "entegrator-status"
version = "0.1.0"
description = "Status and change tracking for everything a software product depends on."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "argon2-cffi",
    "asyncpg",
    "cryptography",
    "cssselect",  # CSS selectors for page_watch, compiled to XPath for lxml (ADR 0009)
    "defusedxml",  # feeds: no DTDs, no entity expansion (ADR 0001)
    "dnspython",
    "fastapi",
    "httpx",
    "jinja2",
    "lxml",  # HTML for page_watch; WSDL/XSD in Phase 7 (ADR 0001)
    "pydantic-settings",
    "pyotp",
    "python-multipart",
    "pyyaml",
    "redis",
    "segno",
    "sqlalchemy[asyncio]",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-httpserver",
    "trustme",
    "httpx2",  # Starlette's TestClient; the product itself uses httpx (ADR 0001)
    "ruff",
    "types-defusedxml",
    "lxml-stubs",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# --- quality -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "N"]
# Turkish copy uses dotless/dotted i on purpose.
allowed-confusables = ["ı", "İ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
"src/sentinel/db/migrations/versions/*" = ["E501"]  # generated constraint strings

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "tests"]
files = ["src/sentinel", "tests", "tools"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/sentinel"]
branch = true
# SQLAlchemy's asyncio layer runs on greenlets; without this, code after awaits is lost.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
