mail:
  verify:
    subject: "Entegratör Status: e-posta adresini doğrula"
    body: |
      Merhaba,

      Hesabını doğrulamak için şu bağlantıyı aç (24 saat geçerli):
      {link}

      Bu kaydı sen yapmadıysan bu e-postayı yok sayabilirsin.
  signup_exists:
    subject: "Entegratör Status: kayıt denemesi"
    body: |
      Merhaba,

      Bu e-posta adresiyle yeni bir hesap açılmak istendi, ancak adresin zaten kayıtlı.
      Parolanı hatırlamıyorsan giriş sayfasındaki "Parolamı unuttum" bağlantısını kullanabilirsin.

      Bu denemeyi sen yapmadıysan bir şey yapmana gerek yok.
  reset:
    subject: "Entegratör Status: parola sıfırlama"
    body: |
      Merhaba,

      Parolanı sıfırlamak için şu bağlantıyı aç (1 saat geçerli):
      {link}

      Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin; parolan değişmez.
